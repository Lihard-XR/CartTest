<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142a59">
  <title>유수연 · YS Solus 온라인 명함</title>
  <meta name="description" content="YS Solus 유수연 웹개발 팀장 온라인 명함">
  <style>
    :root {
      --bg-1:#0f1c3a;
      --bg-2:#1f355f;
      --text:#eef4ff;
      --muted:rgba(238,244,255,.68);
      --accent:#39a7b7;
    }
    * { box-sizing:border-box; }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      min-height: 100svh;
      height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 50% 10%, rgba(57,167,183,.18), transparent 34%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .page {
      width: min(
        92vw,
        820px,
        calc((100svh - 90px) * 1.8)
      );

      margin: 0 auto;
    }
    .scene {
      width: 100%;
      aspect-ratio: 90 / 50;
      perspective:1400px;
      touch-action:manipulation;
      user-select:none;
      -webkit-user-select:none;
    }
    .hint{
      margin: 12px 0 0;
      text-align: center;
    }
    .card {
      position:relative;
      width:100%;
      height:100%;
      transform-style:preserve-3d;
      transition:transform .72s cubic-bezier(.2,.72,.2,1);
      cursor:pointer;
      outline:none;
      border-radius:10px;
      box-shadow:0 22px 55px rgba(0,0,0,.30);
      -webkit-tap-highlight-color:transparent;
      -webkit-touch-callout:none;
      user-select:none;
      -webkit-user-select:none;
    }
    .card:focus-visible {
      box-shadow:0 0 0 3px rgba(255,255,255,.9), 0 22px 55px rgba(0,0,0,.30);
    }
    .card.is-flipped { transform:rotateY(180deg); }
    .face {
      position:absolute;
      -webkit-tap-highlight-color:transparent;
      inset:0;
      overflow:hidden;
      border-radius:10px;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      background:#20345f;
    }
    .face.back { transform:rotateY(180deg); }
    .face img {
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      pointer-events:none;
      -webkit-user-drag:none;
    }
    .hotspot {
      position:absolute;
      z-index:3;
      display:block;
      border-radius:8px;
      text-decoration:none;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    /* 누른 항목만 짧게 파란색으로 피드백 표시 */
    .hotspot::after {
      content:"";
      position:absolute;
      inset:-2px;
      border-radius:inherit;
      pointer-events:none;
      opacity:0;
      background:rgba(20,145,255,.30);
      box-shadow:0 0 0 1px rgba(70,180,255,.55), 0 0 10px rgba(20,145,255,.28);
      transition:opacity .10s ease;
    }
    .hotspot:active::after,
    .hotspot.is-tapped::after { opacity:1; }
    .hotspot:focus-visible {
      outline:3px solid rgba(255,255,255,.95);
      outline-offset:2px;
      background:rgba(57,167,183,.12);
    }
    @media (orientation: landscape) and (max-height: 600px) {

      body {
        padding: 8px;
      }

      .page {
        width: min(
          94vw,
          820px,
          calc((100svh - 16px) * 1.8)
        );
      }

      .hint {
        display: none;
      }
    }
    @media (hover:hover) and (pointer:fine) {
      .hotspot:hover { background:rgba(57,167,183,.10); }
    }
    /* 앞면 기준 좌표 — 실제 텍스트/QR 영역에 가깝게 축소 */
    .qr      { left:83.5%; top:8%;  width:12.3%; height:21.4%; }
    .mobile  { left:46.0%; top:48.3%; width:22%; height:7.0%;  }
    .office  { left:46.0%; top:56%; width:23%; height:7.0%;  }
    .email   { left:46.0%; top:63.7%; width:29.5%; height:7.0%;  }
    .address { left:46.0%; top:76.5%; width:45.6%; height:7.0%;  }

    /* 뒤집힌 뒤 앞면의 투명 링크가 터치를 가로채지 않도록 명시적으로 차단 */
    .card:not(.is-flipped) .face.back { pointer-events:none; }
    .card.is-flipped .face.front { pointer-events:none; }
    .card.is-flipped .face.back { pointer-events:auto; }
    .hint {
      margin:16px 0 0;
      font-size:14px;
      line-height:1.55;
      color:var(--muted);
      letter-spacing:-.01em;
      text-align: center;
    }
    .hint strong { color:rgba(255,255,255,.9); font-weight:600; }
    @media (max-width:520px) {
      body { padding:20px 12px 28px; }
      .page { width:min(96vw, 820px); }
      .card, .face { border-radius:7px; }
      .hint { margin-top:13px; font-size:13px; }
    }
    @media (prefers-reduced-motion:reduce) {
      .card { transition:none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="scene">
      <div class="card" id="businessCard" role="button" tabindex="0" aria-label="명함 앞면. 누르면 뒷면으로 뒤집힙니다." aria-pressed="false">
        <section class="face front" aria-label="명함 앞면">
          <img src="assets/Front_ysy.png" alt="유수연 웹개발 팀장 YS Solus 명함 앞면">

          <a class="hotspot qr" href="https://ys-solus.kr/" target="_blank" rel="noopener" aria-label="YS Solus 홈페이지 열기" title="YS Solus 홈페이지"></a>
          <a class="hotspot mobile" href="tel:+821051261721" aria-label="휴대폰 010-5126-1721로 전화하기" title="010-5126-1721"></a>
          <a class="hotspot office" href="tel:+825042301721" aria-label="회사 전화 0504-230-1721로 전화하기" title="0504-230-1721"></a>
          <a class="hotspot email" href="mailto:ysy.web@ys-solus.kr" aria-label="ysy.web@ys-solus.kr로 이메일 보내기" title="ysy.web@ys-solus.kr"></a>
          <a class="hotspot address" href="https://map.naver.com/p/search/%EB%B6%80%EC%82%B0%EA%B4%91%EC%97%AD%EC%8B%9C%20%EB%82%A8%EA%B5%AC%20%ED%99%A9%EB%A0%B9%EB%8C%80%EB%A1%9C90%EB%B2%88%EA%B8%B8%2055" target="_blank" rel="noopener" aria-label="부산광역시 남구 황령대로90번길 55 지도에서 보기" title="지도에서 보기"></a>
        </section>

        <section class="face back" aria-label="명함 뒷면">
          <img src="assets/Back.png" alt="YS Solus 명함 뒷면">
        </section>
      </div>
    </div>
    <p class="hint"><strong>카드를 터치하면 앞·뒷면이 전환됩니다.</strong><br>앞면의 QR, 전화번호, 이메일, 주소는 그대로 눌러 사용할 수 있습니다.</p>
  </main>

  <script>
    (() => {
      const card = document.getElementById('businessCard');
      if (!card || card.dataset.ready === '1') return;
      card.dataset.ready = '1';

      const flip = () => {
        const flipped = card.classList.toggle('is-flipped');
        card.setAttribute('aria-pressed', String(flipped));
        card.setAttribute('aria-label', flipped
          ? '명함 뒷면. 누르면 앞면으로 뒤집힙니다.'
          : '명함 앞면. 누르면 뒷면으로 뒤집힙니다.');
      };

      card.addEventListener('click', (event) => {
        if (event.target.closest('a')) return;
        flip();
      });

      card.addEventListener('keydown', (event) => {
        if (event.target.closest('a')) return;
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          flip();
        }
      });

      card.querySelectorAll('a').forEach((link) => {
        let releaseTimer;

        const showTap = () => {
          clearTimeout(releaseTimer);
          link.classList.add('is-tapped');
        };
        const hideTap = () => {
          clearTimeout(releaseTimer);
          releaseTimer = setTimeout(() => link.classList.remove('is-tapped'), 260);
        };

        link.addEventListener('pointerdown', showTap);
        link.addEventListener('pointerup', hideTap);
        link.addEventListener('pointercancel', hideTap);
        link.addEventListener('pointerleave', hideTap);
        link.addEventListener('blur', () => link.classList.remove('is-tapped'));
        link.addEventListener('click', (event) => {
          event.stopPropagation();
          showTap();
          hideTap();
        });
      });
    })();
  </script>
</body>
</html>
